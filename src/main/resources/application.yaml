spring:
  application:
    name: LucatBot

shiro:
  ws:
    server:
      enable: true
    access-token: ZftVV~7_wFah3nCL
  plugin-list:
    - org.dlucxoket.lucatbot.adapter.onebot.MainPlugin

# LLM 配置（密钥通过 LLM_API_KEY 环境变量注入）
llm:
  mimo:
    api-key: ${LLM_API_KEY:api-key}
    
#    base-url: "https://token-plan-cn.xiaomimimo.com/v1"
#    base-url: "https://api.xiaomimimo.com/v1"
#    model-name: "mimo-v2.6-flash"
    
    base-url: "https://discovery-api.intern-ai.org.cn/v1"
    model-name: "deepseek-v4-flash-vision"
    # 输出上限（token）：推理型模型别把预算全耗在 reasoning 上交白卷
    #（content 为空 → langchain4j `text cannot be null` → 曾被当成端点故障打断对话）
    max-tokens: 4096
    
#    base-url: "https://api.siliconflow.cn/v1"   #硅基流动
#    model-name: "Qwen/Qwen3-8B"                 #硅基流动免费模型

# 存储后端：json（data 目录下的 json 文件）| mysql（写入即落库，首次启动自动建库建表并迁移 JSON 存量）
storage:
  type: mysql
  mysql:
    host: localhost
    port: 3306
    database: LucatBot
    username: root
    password: "123456"
