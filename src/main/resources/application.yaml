spring:
  application:
    name: LucatBot

shiro:
  ws:
    server:
      enable: true
    access-token: ZftVV~7_wFah3nCL
  plugin-list:
    - org.dlucxoket.lucatbot.adapter.onebot.MainPlugin

# LLM 平台配置——`active` 选平台（platforms 下的 key），**改完重启生效**。
# 每个平台各自配 地址/密钥/模型/输出上限/价格；密钥优先平台专属环境变量、
# 兜底共用 LLM_API_KEY（与旧部署兼容）
llm:
  active: mimo            # ← 用哪个平台：mimo(Token Plan额度制) | mimo-paygo(按量) | intern | siliconflow
  # ← 上下文组织方式：compressed = 每轮压成「一条 system + 一条 user」独立发出（默认，省 token、每轮自包含）
  #                    native    = 传统 agent 式连贯 messages：一次巡逻（消息列表→会话段）共用一套上下文，
  #                                各 Agent 静态指令合并进首轮 system，user/assistant/system 轮一路连贯
  context-mode: compressed
  platforms:
    # 小米 MiMo · **Token Plan**（额度制：按 Credits 扣账户额度，命中缓存极便宜）
    mimo:
      base-url: "https://token-plan-cn.xiaomimimo.com/v1"
      api-key: ${MIMO_API_KEY:${LLM_API_KEY:api-key}}
      model-name: "mimo-v2.6-flash"
      # 输出上限（token）：推理型模型别把预算全耗在 reasoning 上交白卷
      #（content 为空 → langchain4j `text cannot be null` → 曾被当成端点故障打断对话）
      max-tokens: 4096
      # 计费表：Token Plan 按 **Credits / 百万 token** 三档扣额度——
      #   输入（未命中缓存）/ 输入（命中缓存，只扣 1/50~1/120）/ 输出
      #   （删掉 = 该模型不计价，面板不显示消耗——不猜价）
      pricing:
        unit: Credits
        models:
          mimo-v2.6-flash:        # 当前模型
            input-per-1m: 100
            cached-per-1m: 2      # 命中缓存的输入只扣 1/50
            output-per-1m: 200
          mimo-v2.6-pro:
            input-per-1m: 300
            cached-per-1m: 2.5    # 命中缓存的输入只扣 1/120
            output-per-1m: 600

    # 小米 MiMo · **按量计费**（普通 API：用多少付多少，按 token 计价）
    mimo-paygo:
      base-url: "https://api.xiaomimimo.com/v1"
      api-key: ${MIMO_PAYGO_API_KEY:${LLM_API_KEY:api-key}}
      model-name: "mimo-v2.6-flash"
      max-tokens: 4096
      # 按量价填这里（元 / 百万 token，平铺三键即可）；留空 = 不计价
      # pricing:
      #   unit: 元
      #   input-per-1m:
      #   output-per-1m:
      #   cached-per-1m:

    # 上海AI实验室 discovery（deepseek 系）
    intern:
      base-url: "https://discovery-api.intern-ai.org.cn/v1"
      api-key: ${INTERN_API_KEY:${LLM_API_KEY:api-key}}
      model-name: "deepseek-v4-flash-vision"
      max-tokens: 4096
      # 计费：**按 token 平铺单价**（作用于上面 model-name 的模型；unit 可填「元」等）
      # pricing:
      #   unit: 元
      #   input-per-1m: 2
      #   output-per-1m: 8
      #   cached-per-1m: 0.2    # 命中缓存的输入单价（可省）

    # 硅基流动（Qwen/Qwen3-8B 免费模型）
    siliconflow:
      base-url: "https://api.siliconflow.cn/v1"
      api-key: ${SILICONFLOW_API_KEY:${LLM_API_KEY:api-key}}
      model-name: "Qwen/Qwen3-8B"
      max-tokens: 4096
      # pricing: 同上（免费模型可不填）

# 存储后端：json（data 目录下的 json 文件）| mysql（写入即落库，首次启动自动建库建表并迁移 JSON 存量）
storage:
  type: mysql
  mysql:
    host: localhost
    port: 3306
    database: LucatBot
    username: root
    password: "123456"
